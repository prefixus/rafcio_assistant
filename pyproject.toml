[project]
name = "rafcio-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.4.1",
    "httpx>=0.28.1",
    "ipykernel>=7.1.0",
    "langchain>=1.2.7",
    "langchain-community>=0.4.1",
    "langchain-openai>=1.1.7",
    "langchain-text-splitters>=1.1.0",
    "langgraph>=1.0.7",
    "mypy>=1.19.1",
    "pre-commit>=4.5.1",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "pylint>=4.0.4",
    "pypdf>=6.6.2",
    "pytest>=9.0.2",
    "python-dotenv>=1.2.1",
    "rank-bm25>=0.2.2",
    "ruff>=0.14.14",
]
[tool.pytest.ini_options]
pythonpath = ["."]
addopts = ["--import-mode=importlib"]

[tool.ruff]
# Exclude .ipynb files
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
]

[tool.ruff.lint]
# Only run on Python, not ipynb
select = ["E", "F", "W", "I", "N"]  # your selected rules
ignore = ["E501"]  # your ignored rules

[tool.pylint.main]
# Exclude .ipynb files
ignore = [".venv", "__pycache__"]

[tool.mypy]
# Exclude .ipynb files
exclude = [".venv", "build", "dist"]
